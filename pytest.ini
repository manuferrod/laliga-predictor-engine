[pytest]
# Las baterías viven junto a los módulos que validan, no en un árbol 'tests/'
# separado: se leen como el guion de comprobación de su propio módulo.
testpaths = scripts

# Sin esta exclusión, la recolección entra en el entorno virtual y en el material
# archivado, que traen sus propios ficheros test_*.py ajenos al proyecto.
norecursedirs = .venv _legacy_v1 data downloaded_files manual notebooks outputs tm_tmp *.egg-info

addopts = -q --strict-markers
